[package]
name = "voxgig_sekreto"
version = "0.1.0"
edition = "2021"
description = "sekreto: one interface for secrets, wherever they live (Rust)"
license = "MIT"

[dependencies]
# The one exception to this repo's no-dependencies rule, and a deliberate
# one: a secrets library that talks to a remote vault needs TLS, and
# hand-rolling TLS would be far worse than taking a well-audited crate.
# rustls is pure Rust and memory-safe; webpki-roots supplies the Mozilla
# root set. Nothing else is pulled in.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "0.26"

[lib]
name = "voxgig_sekreto"
path = "src/lib.rs"

[[bin]]
name = "sekreto-cli"
path = "src/bin/sekreto-cli.rs"

# voxgig/omni drives the conformance suite only - the library and CLI depend
# on nothing but the crates above. The suite is its own package (`corpus/`),
# so that omni - which it needs and this library does not - stays out of this
# manifest entirely. Cargo resolves dev-dependencies even for `cargo build`,
# so a dev-dependency here broke a checkout with no omni link under vendor/.
# Omni register 4.13; the same shape as voxgig/struct#97.
# `vendor` is excluded as well: the link under it points at a whole sibling
# checkout, which can be a workspace root of its own - unexcluded, Cargo
# reads it as a nested root of THIS workspace and refuses to build.
[workspace]
exclude = ["corpus", "vendor"]
