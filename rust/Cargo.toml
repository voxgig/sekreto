[package]
name = "voxgig_sekreto"
version = "0.1.0"
edition = "2021"
description = "sekreto: one interface for secrets, wherever they live (Rust)"
license = "MIT"

# THE CORE, AND ITS DEPENDENCY LIST IS ONE LINE.
#
# This crate used to name rustls and webpki-roots, and every consumer paid
# for them - twelve crates in the closure - whether or not its chain ever
# touched a remote vault. It no longer does. The four built-in kinds read
# at most a local file, and every kind that opens a socket, signs a request
# or spawns a process is a plugin crate under `plugins/`, linked only by a
# binary that names it (docs/design/plugin-providers.md, AGENTS.md rule 4).
#
# The TLS exception of AGENTS.md rule 3 has not gone away - it has moved to
# `plugins/httpjson`, which is where the sockets are. `cargo tree -p
# voxgig_sekreto --edges normal` is the proof that it is not here, and
# `make check-core` is the proof that nothing here reaches for it by hand.
#
# voxgig/plugin is the one Voxgig dependency AGENTS.md rule 3 permits, and
# it takes nothing itself. It has no registry release, so it arrives the
# way every port finds omni: a checkout, linked at `.plugin/rust` by `make
# deps` from $PLUGIN_HOME or a sibling, and shallow-cloned when there is
# none. The link is gitignored; the manifest names a stable path.
[dependencies]
voxgig_plugin = { path = ".plugin/rust" }

[lib]
name = "voxgig_sekreto"
path = "src/lib.rs"

# The plugins are workspace MEMBERS, one crate per kind, so that `cargo
# tree -p <crate>` answers "what does this one plugin actually link?" - and
# so that the CLI, which wants all ten, and a lean app, which wants one,
# are two different dependency graphs rather than two comments.
#
# `corpus` stays excluded: the conformance suite is its own package so that
# omni - which it needs and this library does not - stays out of every
# manifest here. Cargo resolves dev-dependencies even for `cargo build`, so
# a dev-dependency in this file broke a checkout with no omni. Omni
# register 4.13; the same shape as voxgig/struct#97.
#
# `.plugin` and `vendor` are excluded because each holds a link to a WHOLE
# sibling checkout, which can be a workspace root of its own - unexcluded,
# Cargo reads one as a nested root of THIS workspace and refuses to build.
[workspace]
members = [
  "plugins/httpjson",
  "plugins/hashicorp",
  "plugins/boru",
  "plugins/aws",
  "plugins/gcpsecrets",
  "plugins/azuresecrets",
  "plugins/onepassword",
  "plugins/doppler",
  "plugins/infisical",
  "plugins/secretspec",
  "plugins/all",
]
exclude = ["corpus", "vendor", ".plugin"]
