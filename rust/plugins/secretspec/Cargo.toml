# the SecretSpec provider
#
# One plugin, one crate: `cargo tree -p voxgig_sekreto_secretspec` is the honest
# answer to "what does this kind actually link?", and the core links none
# of it (docs/design/plugin-providers.md, AGENTS.md rule 4).
[package]
name = "voxgig_sekreto_secretspec"
version = "0.1.0"
edition = "2021"
description = "sekreto: the SecretSpec provider"
license = "MIT"

[dependencies]
voxgig_sekreto = { path = "../.." }
voxgig_plugin = { path = "../../.plugin/rust" }

[lib]
name = "voxgig_sekreto_secretspec"
path = "src/lib.rs"
