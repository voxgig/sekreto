# The real secret stores, on demand and on a schedule.
#
# ci.yml runs every port against the MOCKS on every push. That is the
# gate, and it stays the gate: it is fast, hermetic, and depends on
# nothing outside this repository.
#
# This job runs the same ports against the REAL servers - HashiCorp
# Vault, LocalStack, Infisical, a Key Vault emulator, a real boru. It is
# deliberately NOT on push or pull_request. It pulls several images,
# waits on a database migration, and depends on servers whose new
# releases can change behaviour with nothing here changing at all; as a
# gate on every PR it would be a flake generator. On a schedule it is
# what it should be - a periodic check on whether the fast suite is
# still telling the truth, arriving as its own failure rather than as
# noise on someone's PR.
#
# A failure here means one of two things, and both are worth a morning:
# a port has a bug the mocks do not model, or a mock has drifted from
# the server it imitates.
#
# doc/design/real-stores.md says which services are the vendor's own,
# which are emulators, and which cannot be run locally at all.

name: real-stores

on:
  workflow_dispatch:
    inputs:
      langs:
        description: 'Ports to run (space separated, blank for all)'
        required: false
        default: ''
  schedule:
    # 05:20 UTC on Mondays. Off the hour because everything is scheduled
    # on the hour, and early enough that a failure is waiting rather than
    # arriving mid-morning.
    - cron: '20 5 * * 1'

concurrency:
  group: real-stores-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KOTLIN_VERSION: '2.1.20'
  SCALA_VERSION: '3.4.2'
  CLOJURE_VERSION: '1.12.0.1530'
  SWIFT_VERSION: '5.10.1'

jobs:
  real-stores:
    name: every port against the real stores
    runs-on: ubuntu-latest
    # Image pulls, an Infisical migration and ten toolchains. Generous,
    # because a timeout here reads as a store being broken.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out voxgig/omni
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni

      # The library's one Voxgig dependency: an adopted port does not
      # build without it, and this workflow builds every port.
      - name: Check out voxgig/plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/plugin
          path: .plugin

      - name: Check out boru-lang/boru
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: boru-lang/boru
          path: .boru

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      # 1.24, not the 1.22 the go PORT is built with: boru's own module
      # requires a newer toolchain, and building it with 1.22 fails - so
      # every boru check silently skips and the job is green while boru
      # was never exercised at all.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Kotlin
        run: |
          curl -sSLf --retry 3 -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlinc.zip -d /opt
          echo /opt/kotlinc/bin >> "$GITHUB_PATH"
      - name: Setup Scala
        run: |
          curl -sSLf --retry 3 -o /tmp/scala3.tar.gz \
            "https://github.com/scala/scala3/releases/download/${SCALA_VERSION}/scala3-${SCALA_VERSION}.tar.gz"
          mkdir -p /opt/scala3
          tar xzf /tmp/scala3.tar.gz -C /opt/scala3 --strip-components=1
          echo /opt/scala3/bin >> "$GITHUB_PATH"
      # The OFFICIAL Clojure CLI, pinned. Ubuntu's `clojure` package is a
      # DIFFERENT PROGRAM: it runs the Clojure jar directly and understands
      # neither -M nor deps.edn aliases, both of which this port's Makefile
      # and voxgig/omni's own clojure runner need. Installing to $HOME keeps
      # it out of sudo's way; the script's default prefix is /usr/local.
      - name: Setup Clojure
        run: |
          curl -sSLf --retry 3 -o /tmp/clojure-install.sh \
            "https://download.clojure.org/install/linux-install-${CLOJURE_VERSION}.sh"
          chmod +x /tmp/clojure-install.sh
          /tmp/clojure-install.sh --prefix "$HOME/clojure-cli"
          echo "$HOME/clojure-cli/bin" >> "$GITHUB_PATH"
      # swift.org publishes one build per Ubuntu release, and 5.10.1 has NO
      # 24.04 build -- 24.04 support arrived with Swift 6. The 22.04 build
      # runs on 24.04, which is what ubuntu-latest is: verified, not assumed
      # (the port was written and its suite run under exactly this tarball on
      # Ubuntu 24.04.4). Moving to a 6.x build is the alternative and is a
      # bigger change than it looks -- Swift 6 language mode is a different
      # concurrency dialect -- so pin what is known to work.
      #
      # corelibs-foundation reaches libcurl and libxml2 at RUNTIME, which is
      # why they are installed rather than assumed: FoundationNetworking is
      # a libcurl client, and a missing one surfaces as a link error at the
      # first URLSession call rather than at setup.
      - name: Setup Swift
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libcurl4-openssl-dev libxml2-dev libpython3-dev
          curl -sSLf --retry 3 -o /tmp/swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2204/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu22.04.tar.gz"
          sudo mkdir -p /opt/swift
          sudo tar xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
      # Dart from Google's APT repository, not the dart-archive bucket. The
      # bucket URL that the SDK docs give --
      # storage.googleapis.com/dart-archive/channels/stable/release/<v>/sdk/
      # dartsdk-linux-x64.release.zip -- answered 404 for every version
      # tried, both the pinned one and an older known-good one, and took
      # `conformance / dart` down with it. The APT repo is the route that
      # actually works and is the one this port was developed against.
      #
      # The version therefore comes from the repo rather than from a pin
      # here, so `dart --version` is printed: a silent major bump is the
      # thing worth seeing in the log.
      - name: Setup Dart
        run: |
          curl -sSLf --retry 3 https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg
          echo "deb [signed-by=/usr/share/keyrings/dart.gpg] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/dart.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dart
          echo /usr/lib/dart/bin >> "$GITHUB_PATH"
          /usr/lib/dart/bin/dart --version
      # Elixir from the Ubuntu archive rather than a pinned tarball, and the
      # OTP version is PRINTED rather than assumed. more-ports.md records
      # that Ubuntu ships OTP 25, where neither :json nor Elixir's JSON
      # module exists -- which is why this port hand-rolls its JSON. That
      # floor is the thing worth knowing when this line changes, so the step
      # says out loud which OTP it got.
      - name: Setup Elixir
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends elixir
          elixir --version | tail -1
          erl -eval 'io:format("OTP ~s~n",[erlang:system_info(otp_release)]),halt().' -noshell
      - name: Setup OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libssl-dev
      # lua5.4 from the Ubuntu archive, and the OpenSSL headers the port's
      # own transport needs. Lua has no sockets at all, so the Makefile
      # compiles native/sekretonet.c into a helper the library runs -- the
      # -dev package is a BUILD requirement here, not an optional extra.
      - name: Setup Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lua5.4 libssl-dev
      # ocaml and haskell from the Ubuntu archive; neither port uses a
      # package manager, so the compiler is all that is needed. libssl-dev
      # is a BUILD requirement for both -- ocaml binds OpenSSL through C
      # stubs and haskell through the FFI, since GHC's boot libraries have
      # no networking at all, not even a socket.
      - name: Setup OCaml
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ocaml libssl-dev
      - name: Setup Haskell
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ghc libssl-dev
      # Lean via elan, pinned by the port's own lean-toolchain. libcurl is
      # the binding more-ports.md names for Lean specifically -- it handles
      # chain and hostname verification itself.
      - name: Setup Lean
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libcurl4-openssl-dev
          curl -sSLf --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0'
      - name: Setup Zig
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/zig-requirements.txt"
          bin="$RUNNER_TEMP/zigbin"; mkdir -p "$bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$bin/zig"
          chmod +x "$bin/zig"
          echo "$bin" >> "$GITHUB_PATH"

      # The Perl port needs IO::Socket::SSL to speak https, and it is not
      # a core module. Without it the Azure check - the only https check
      # in either suite - skips for perl rather than running. Installing
      # it here is what makes that check mean something.
      - name: Perl TLS support
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libio-socket-ssl-perl

      # The boru provider is proved against the real binary or not at
      # all. A build failure here must not read as a sekreto failure:
      # the step may fail, and the harness skips the boru checks when the
      # binary is absent.
      - name: Build boru
        id: boru
        continue-on-error: true
        run: go build -o "$GITHUB_WORKSPACE/boru-bin" ./cmd/go/boru
        working-directory: .boru

      - name: Install dependencies
        run: |
          npm --prefix typescript install
          npm --prefix api install

      # Not `make build`: the top-level build-% rule tolerates a port
      # without a build target, which also swallows a port whose build
      # *fails*. Here each one must succeed on its own.
      - name: Build every port
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
          PLUGIN_HOME: ${{ github.workspace }}/.plugin
        run: |
          for lang in $(make -s print-langs); do
            echo "======== $lang ========"
            make -C "$lang" build
          done

      # Pulled before the harness runs so that a slow registry shows up
      # as a slow step rather than as a store that "did not come up".
      - name: Pull the store images
        run: docker compose -f test/docker/compose.yaml pull --ignore-buildable

      - name: Real stores
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
          PLUGIN_HOME: ${{ github.workspace }}/.plugin
          BORU: ${{ steps.boru.outcome == 'success' && format('{0}/boru-bin', github.workspace) || '' }}
          # A port that did not build must fail the job, not be skipped.
          REQUIRE_ALL: '1'
          # So must a store that did not come up. Locally a missing store
          # is a skip, because a developer may only care about one; here
          # it means an image moved or a server stopped working, which is
          # precisely what this job exists to notice.
          REQUIRE_STORES: '1'
          # Through the environment, not interpolated into the command
          # line: this is a free-text dispatch input.
          LANGS: ${{ inputs.langs }}
          # The harness tears the stack down on its way out unless told
          # not to, and the Store logs step below would then have nothing
          # to read - the logs being the only place a failure like the
          # Java HTTP/2 one is visible at all. Tear-down is the last
          # step's job instead.
          SEKRETO_KEEP: '1'
        run: |
          # shellcheck disable=SC2086
          ./test/realstores.sh $LANGS

      # Whatever happened, the logs of the servers are the first thing
      # anyone reads when this fails - a 500 from Infisical says nothing
      # useful on the client side, which is exactly how the Java HTTP/2
      # bug hid.
      - name: Store logs
        if: always()
        run: docker compose -f test/docker/compose.yaml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f test/docker/compose.yaml down -v
