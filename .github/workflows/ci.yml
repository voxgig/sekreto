# CI for sekreto.
#
# Two jobs, mirroring the two things `make all` proves:
#
#   conformance  each port computes the same answers from spec/sekreto.json
#   integration  each port can actually fetch a secret and use it
#
# Conformance is a matrix so a single port failing is named in the UI rather
# than buried. Integration is one job, because it needs every port built at
# once against one set of servers.
#
# Both need a voxgig/omni checkout; the libraries and CLIs never do.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: conformance / ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang:
          - typescript
          - javascript
          - python
          - ruby
          - php
          - perl
          - go
          - rust
          - java
          - csharp
    steps:
      - uses: actions/checkout@v4

      - name: Check out voxgig/omni
        uses: actions/checkout@v4
        with:
          repository: voxgig/omni
          path: .omni

      - uses: actions/setup-node@v4
        if: matrix.lang == 'typescript' || matrix.lang == 'javascript'
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          python-version: '3.12'

      - uses: ruby/setup-ruby@v1
        if: matrix.lang == 'ruby'
        with:
          ruby-version: '3.3'

      - uses: shivammathur/setup-php@v2
        if: matrix.lang == 'php'
        with:
          php-version: '8.3'

      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: '1.22'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.lang == 'rust'

      - uses: actions/setup-java@v4
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: '8.0'

      # perl ships with the runner, and this port needs only core modules.

      - name: Install dependencies
        if: matrix.lang == 'typescript'
        run: npm --prefix typescript install

      - name: Test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: make test-${{ matrix.lang }}

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out voxgig/omni
        uses: actions/checkout@v4
        with:
          repository: voxgig/omni
          path: .omni

      - name: Check out boru-lang/boru
        uses: actions/checkout@v4
        with:
          repository: boru-lang/boru
          path: .boru

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      # boru has no read-a-secret wire protocol, so its provider is proved
      # against the real binary or not at all. A build failure here must not
      # be mistaken for a sekreto failure: the step is allowed to fail, and
      # integration.sh skips the boru checks when the binary is absent.
      - name: Build boru
        id: boru
        continue-on-error: true
        run: go build -o "$GITHUB_WORKSPACE/boru-bin" ./cmd/go/boru
        working-directory: .boru

      - name: Install dependencies
        run: |
          npm --prefix typescript install
          npm --prefix api install

      # Not `make build`: the top-level build-% rule tolerates a port
      # without a build target, which also swallows a port whose build
      # *fails*. Here each one must succeed on its own.
      - name: Build every port
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: |
          for lang in typescript javascript python ruby php perl go rust java csharp; do
            echo "======== $lang ========"
            make -C "$lang" build
          done

      - name: Integration
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
          BORU: ${{ steps.boru.outcome == 'success' && format('{0}/boru-bin', github.workspace) || '' }}
          # A port that did not build must fail the job, not be skipped.
          REQUIRE_ALL: '1'
        run: ./test/integration.sh
