# CI for sekreto.
#
# Two jobs, mirroring the two things `make all` proves:
#
#   conformance  each port computes the same answers from spec/sekreto.json
#   integration  each port can actually fetch a secret and use it
#
# Conformance is a matrix so a single port failing is named in the UI rather
# than buried. Integration is one job, because it needs every port built at
# once against one set of servers.
#
# Both need a voxgig/omni checkout; the libraries and CLIs never do.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place, because three jobs install it.
  KOTLIN_VERSION: '2.1.20'

jobs:
  omni-isolation:
    name: omni must not reach any shipped library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # THE OMNI CHECKOUT IS PRESENT ON PURPOSE, and it is what makes this job
      # mean anything. Omni register 4.13's rule is about DECLARATION - nothing
      # a port's library manifest may name omni - but the proof it originally
      # prescribed was about RESOLUTION: build with the checkout absent and see
      # it fail. Those stopped being the same test. omni is a public repo, so
      # `github.com/voxgig/omni/go` resolves from proxy.golang.org with no tags
      # at all, and `go mod tidy` in a module with no checkout anywhere still
      # writes the require line.
      #
      # So this makes omni as resolvable as it can be and then asserts the
      # manifests still declare nothing - a check that cannot pass by accident
      # of omni being missing.
      - name: Check out voxgig/omni beside the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Library manifests must not declare omni
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: python3 tools/omni_isolation.py
      # A guard that has never failed is not a guard.
      - name: The guard must catch what it claims to
        run: python3 tools/omni_isolation_selftest.py
  # spec/sekreto.json is generated from spec/*.aon and committed so that
  # no port needs a Node toolchain. Recompile it here and fail if the
  # committed copy differs — a spec edit cannot land with a stale artifact.
  spec-freshness:
    name: spec regenerates from *.aon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: make spec
      # Not `git diff --exit-code`: that ignores untracked files, so a commit
      # adding a new spec/*.aon without its generated JSON would pass while
      # the artifact the ports read was never committed at all.
      - name: Fail if a committed spec JSON is stale or missing
        run: |
          if [ -n "$(git status --porcelain -- spec/)" ]; then
            git status --porcelain -- spec/
            echo
            echo "spec/ is out of sync with its .aon sources."
            echo "Run 'make spec' and commit the result."
            exit 1
          fi

  conformance:
    name: conformance / ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang:
          - typescript
          - javascript
          - python
          - ruby
          - php
          - perl
          - go
          - rust
          - java
          - csharp
          - zig
          - kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # voxgig/omni is checked out AFTER the no-omni proofs below, not
      # here: with .omni on disk a leaked `replace` or path dependency
      # pointing into it would resolve, and the proof would pass on a
      # library that does name omni. An absent checkout is the only
      # machine that cannot be fooled.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.lang == 'typescript' || matrix.lang == 'javascript'
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.lang == 'python' || matrix.lang == 'zig'
        with:
          python-version: '3.12'

      # ziglang from PyPI, pinned by hash in .github/zig-requirements.txt.
      # There is no zig package in Ubuntu's archives, and every published
      # zig setup action targets a Node version GitHub now refuses. This
      # is the route voxgig/struct takes for the same reasons.
      - name: Setup Zig
        if: matrix.lang == 'zig'
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/zig-requirements.txt"
          bin="$RUNNER_TEMP/zigbin"; mkdir -p "$bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$bin/zig"
          chmod +x "$bin/zig"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/zig" version


      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        if: matrix.lang == 'ruby'
        with:
          ruby-version: '3.3'

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: matrix.lang == 'php'
        with:
          php-version: '8.3'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.lang == 'go'
        with:
          go-version: '1.22'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
        if: matrix.lang == 'rust'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.lang == 'java' || matrix.lang == 'kotlin'
        with:
          distribution: temurin
          java-version: '21'

      # kotlinc from Maven Central, pinned. There is no kotlin package in
      # Ubuntu's archives and the JetBrains release assets live on GitHub
      # releases; the compiler distribution on Maven Central is the same
      # artifact and is reachable the same way every other JVM dependency
      # is.
      - name: Setup Kotlin
        if: matrix.lang == 'kotlin'
        run: |
          # --fail, so a wrong URL is an error here rather than a
          # not-a-zipfile three lines later: Maven Central carries the
          # kotlin-compiler JAR but not the standalone distribution, and
          # fetching the jar's name with a .zip suffix returns a 404 page
          # that curl will happily save.
          curl -sSLf --retry 3 -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlinc.zip -d /opt
          echo /opt/kotlinc/bin >> "$GITHUB_PATH"


      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: '8.0'

      # perl ships with the runner, and this port needs only core modules.

      # omni register 4.13: the conformance suite is a nested module
      # (go/testutil), so the published module must build - and its
      # tests resolve - naming no omni. GOWORK=off disables workspace
      # discovery; the omni checkout not existing yet closes the other
      # door, a leaked `replace` resolving a relative path into it.
      - name: Library builds without omni
        if: matrix.lang == 'go'
        working-directory: ./go
        env:
          GOWORK: off
        run: |
          go build ./...
          go test -count=1 ./...

      # omni register 4.13: the corpus runner is a separate package
      # (rust/corpus) so omni stays out of the library's manifest.
      # Cargo resolves dev-dependencies even for `cargo build`, so this
      # must pass with no vendor link present - checked here, before
      # the Test step's `make vendor` creates one.
      - name: Library builds without omni
        if: matrix.lang == 'rust'
        working-directory: ./rust
        run: cargo build --all-targets

      # Only now, with both proofs behind us, does omni reach the disk.
      - name: Check out voxgig/omni
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni

      - name: Install dependencies
        if: matrix.lang == 'typescript'
        run: npm --prefix typescript install

      - name: Test
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: make test-${{ matrix.lang }}

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out voxgig/omni
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni

      - name: Check out boru-lang/boru
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: boru-lang/boru
          path: .boru

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0'
      - name: Setup Kotlin
        run: |
          curl -sSLf --retry 3 -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q /tmp/kotlinc.zip -d /opt
          echo /opt/kotlinc/bin >> "$GITHUB_PATH"
      - name: Setup Zig
        run: |
          python3 -m pip install --disable-pip-version-check --quiet \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/zig-requirements.txt"
          bin="$RUNNER_TEMP/zigbin"; mkdir -p "$bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$bin/zig"
          chmod +x "$bin/zig"
          echo "$bin" >> "$GITHUB_PATH"

      # The boru provider is proved against the real binary or not at all -
      # both the CLI path and, when this boru build has `vault serve` and
      # wildcard grants, the wire-protocol path (integration.sh degrades to
      # skipping the wire checks on an older boru). A build failure here
      # must not be mistaken for a sekreto failure: the step is allowed to
      # fail, and integration.sh skips the boru checks when the binary is
      # absent.
      - name: Build boru
        id: boru
        continue-on-error: true
        run: go build -o "$GITHUB_WORKSPACE/boru-bin" ./cmd/go/boru
        working-directory: .boru

      - name: Install dependencies
        run: |
          npm --prefix typescript install
          npm --prefix api install

      # Not `make build`: the top-level build-% rule tolerates a port
      # without a build target, which also swallows a port whose build
      # *fails*. Here each one must succeed on its own.
      - name: Build every port
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
        run: |
          for lang in typescript javascript python ruby php perl go rust java csharp zig kotlin; do
            echo "======== $lang ========"
            make -C "$lang" build
          done

      - name: Integration
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
          BORU: ${{ steps.boru.outcome == 'success' && format('{0}/boru-bin', github.workspace) || '' }}
          # A port that did not build must fail the job, not be skipped.
          REQUIRE_ALL: '1'
        run: ./test/integration.sh
